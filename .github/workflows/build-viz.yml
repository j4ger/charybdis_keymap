name: Build Keymap Visualization

on:
  push:
    branches: [main]
    paths:
      - 'keyboards/**/keymap.c'
      - 'qmk.json'
      - '.github/workflows/build-viz.yml'
      - 'scripts/**'
      - 'templates/**'
      - 'static/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate visualization
        run: |
          set -euo pipefail

          # Generate viz only for keymaps declared in root qmk.json
          python3 - <<'PY' | while IFS=$'\t' read -r keymap_path name; do
          import json
          import re
          from pathlib import Path

          with open("qmk.json", "r", encoding="utf-8") as f:
              qmk_json = f.read()
          qmk_json = re.sub(r",(\s*[}\\]])", r"\1", qmk_json)
          targets = json.loads(qmk_json).get("build_targets", [])

          for target in targets:
              if not isinstance(target, list) or len(target) < 2:
                  continue
              keyboard, keymap = target[0], target[1]
              path = Path("keyboards") / keyboard / "keymaps" / keymap / "keymap.c"
              slug = f"{keyboard.replace('/', '-')}--{keymap}"
              print(f"{path}\t{slug}")
          PY
            if [ ! -f "$keymap_path" ]; then
              echo "::error::Keymap file not found: $keymap_path"
              exit 1
            fi
            echo "Processing: $keymap_path"
            out_path="_site/${name}/index.html"
            mkdir -p "$(dirname "$out_path")"
            python3 scripts/qmk_keymap_viz.py "$keymap_path" -o "$out_path" -t "$name"
          done

          # Generate index page listing all keymaps
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Keymap Visualizations</title>
          <style>body{font-family:system-ui;max-width:600px;margin:40px auto;padding:0 20px;background:#0d1117;color:#c9d1d9}
          a{color:#58a6ff;text-decoration:none}a:hover{text-decoration:underline}li{margin:8px 0}</style></head>
          <body><h1>⌨️ Keymap Visualizations</h1><ul>' > _site/index.html
          find _site -name index.html -not -path _site/index.html | sort | while read f; do
            name=$(basename $(dirname "$f"))
            echo "<li><a href=\"${name}/\">${name}</a></li>" >> _site/index.html
          done
          echo '</ul></body></html>' >> _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
