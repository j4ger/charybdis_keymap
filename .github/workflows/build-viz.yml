name: Build Keymap Visualization

on:
  push:
    branches: [main]
    paths:
      - 'keyboards/**/keymap.c'
      - '.github/workflows/build-viz.yml'
      - 'scripts/qmk_keymap_viz.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate visualization
        run: |
          # Find all keymap.c files and generate viz for each
          find keyboards -name keymap.c | while read f; do
            dir=$(dirname "$f")
            name=$(basename "$dir")
            echo "Processing: $f"
            python3 scripts/qmk_keymap_viz.py "$f" -o "_site/${name}/index.html" -t "$name"
          done

          # Generate index page listing all keymaps
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Keymap Visualizations</title>
          <style>body{font-family:system-ui;max-width:600px;margin:40px auto;padding:0 20px;background:#0d1117;color:#c9d1d9}
          a{color:#58a6ff;text-decoration:none}a:hover{text-decoration:underline}li{margin:8px 0}</style></head>
          <body><h1>⌨️ Keymap Visualizations</h1><ul>' > _site/index.html
          find _site -name index.html -not -path _site/index.html | sort | while read f; do
            name=$(basename $(dirname "$f"))
            echo "<li><a href=\"${name}/\">${name}</a></li>" >> _site/index.html
          done
          echo '</ul></body></html>' >> _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
